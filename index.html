<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WFDC Wangnoi — Systems Board</title>
<meta name="description" content="ศูนย์รวมระบบไอทีภายในของ WFDC Wangnoi — ครอบคลุม WFDC · CDC · HDC">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231B4F9C'/%3E%3Crect x='7' y='8' width='18' height='4' rx='2' fill='%23FFFFFF'/%3E%3Crect x='7' y='14' width='18' height='4' rx='2' fill='%23FFD24A'/%3E%3Crect x='7' y='20' width='11' height='4' rx='2' fill='%23FFFFFF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-900:#0F3B77;
    --blue-700:#1B4F9C;
    --blue-500:#2C74C4;
    --blue-100:#DCEAF8;
    --blue-050:#EEF6FD;

    --red-600:#D8342A;
    --red-500:#E8483C;

    --green-600:#2E9E5B;
    --amber-500:#FFC431;

    --ink:#14335C;
    --ink-soft:#5A7396;
    --white:#FFFFFF;
    --line:#D6E4F2;

    --font-display:'Nunito', 'Noto Sans Thai', sans-serif;
    --font-body:'Noto Sans Thai', 'Noto Sans Myanmar', sans-serif;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    font-family:var(--font-body);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(circle at 12% 8%, rgba(255,255,255,.55) 0, transparent 42%),
      radial-gradient(circle at 88% 4%, rgba(255,255,255,.35) 0, transparent 38%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 2px, transparent 2px 96px),
      repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 2px, transparent 2px 96px),
      linear-gradient(168deg, #3E8BD6 0%, #2C74C4 38%, #1B4F9C 100%);
    background-attachment:fixed;
    min-height:100vh;
  }

  a{ color:inherit; text-decoration:none; }

  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:clamp(1rem,3vw,1.75rem) clamp(1rem,4vw,2.5rem) 3rem;
  }

  /* ---------- TOP BAR ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:1rem;
    flex-wrap:wrap;
    margin-bottom:clamp(1.25rem,3vw,2rem);
  }

  .lang-group{
    display:inline-flex;
    background:rgba(255,255,255,.94);
    border-radius:999px;
    padding:4px;
    box-shadow:0 4px 14px rgba(10,40,80,.16);
  }

  .lang-btn{
    appearance:none; border:none; cursor:pointer;
    background:transparent;
    border-radius:999px;
    font-family:var(--font-body);
    font-size:.8rem;
    font-weight:700;
    padding:.42rem .95rem;
    color:var(--ink-soft);
    transition:background .15s ease, color .15s ease;
  }
  .lang-btn:hover{ color:var(--blue-700); }
  .lang-btn.is-active{ background:var(--blue-700); color:#fff; }
  .lang-btn:focus-visible{ outline:2px solid var(--white); outline-offset:2px; }

  /* ---------- HERO BANNER ---------- */
  .hero{
    background:rgba(255,255,255,.5);
    border:2px solid rgba(255,255,255,.75);
    border-radius:26px;
    padding:clamp(1.5rem,4vw,2.5rem) clamp(1.25rem,4vw,2.5rem) clamp(1.5rem,4vw,2rem);
    backdrop-filter:blur(3px);
    box-shadow:0 12px 34px rgba(10,40,80,.18);
  }

  .banner{
    background:linear-gradient(180deg, var(--red-500), var(--red-600));
    border:4px solid var(--white);
    border-radius:20px;
    padding:clamp(.9rem,2.5vw,1.35rem) clamp(1.1rem,3vw,2rem);
    box-shadow:0 10px 0 rgba(140,26,20,.28), 0 16px 30px rgba(10,40,80,.22);
    text-align:center;
    margin-bottom:1.6rem;
  }

  .banner h1{
    font-family:var(--font-display);
    font-weight:900;
    color:#fff;
    margin:0;
    line-height:1.12;
    font-size:clamp(1.65rem,5.2vw,3rem);
    text-shadow:0 3px 0 rgba(120,20,16,.35);
    letter-spacing:.01em;
  }

  .banner p{
    margin:.45rem 0 0;
    color:rgba(255,255,255,.94);
    font-size:clamp(.85rem,2vw,1rem);
    font-weight:600;
  }

  .hero__lead{
    max-width:62ch;
    margin:0 auto 1.5rem;
    text-align:center;
    font-size:clamp(.92rem,2vw,1.02rem);
    line-height:1.85;
    color:var(--ink);
  }

  .hero__stats{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:.6rem;
  }

  .stat{
    display:inline-flex;
    align-items:center;
    gap:.5rem;
    background:var(--white);
    border:1.5px solid var(--line);
    border-radius:999px;
    padding:.45rem .9rem;
    font-size:.82rem;
    font-weight:700;
    color:var(--blue-700);
    box-shadow:0 2px 6px rgba(10,40,80,.07);
  }

  .stat svg{ width:16px; height:16px; }

  .stat--sites{ color:var(--ink-soft); font-weight:600; }

  /* ---------- GRID ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(290px,1fr));
    gap:1.25rem;
    margin-top:clamp(1.5rem,4vw,2.25rem);
  }

  .card{
    display:flex;
    flex-direction:column;
    background:var(--white);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 8px 22px rgba(10,40,80,.16);
    opacity:0;
    transform:translateY(14px);
    animation:rise .5s ease forwards;
    transition:transform .18s ease, box-shadow .18s ease;
  }

  a.card:hover, a.card:focus-visible{
    transform:translateY(-6px);
    box-shadow:0 18px 34px rgba(10,40,80,.26);
  }
  a.card:focus-visible{ outline:3px solid var(--white); outline-offset:3px; }

  .card__bar{
    display:flex;
    align-items:center;
    gap:.7rem;
    background:var(--c, var(--blue-700));
    padding:.8rem 1rem;
  }

  .card__icon{
    flex:0 0 auto;
    width:36px; height:36px;
    border-radius:50%;
    background:rgba(255,255,255,.92);
    color:var(--c, var(--blue-700));
    display:flex; align-items:center; justify-content:center;
  }
  .card__icon svg{ width:19px; height:19px; }

  .card__barText{
    display:flex;
    flex-direction:column;
    line-height:1.25;
    min-width:0;
  }

  .card__no{
    font-family:var(--font-display);
    font-weight:800;
    font-size:.68rem;
    letter-spacing:.1em;
    color:rgba(255,255,255,.8);
  }

  .card__title{
    font-family:var(--font-display);
    font-weight:800;
    font-size:1.02rem;
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .card__body{
    padding:1.1rem 1.15rem 1.25rem;
    display:flex;
    flex-direction:column;
    flex-grow:1;
  }

  .card__localName{
    font-size:.93rem;
    font-weight:700;
    color:var(--blue-900);
    margin:0 0 .6rem;
    line-height:1.5;
  }

  .card__desc{
    position:relative;
    background:var(--blue-050);
    border-radius:12px;
    padding:.75rem .85rem;
    font-size:.85rem;
    line-height:1.75;
    color:var(--ink-soft);
    margin:0;
    flex-grow:1;
  }

  .card__foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:.6rem;
    margin-top:1rem;
  }

  .tag{
    display:inline-flex;
    align-items:center;
    gap:.35rem;
    font-size:.7rem;
    font-weight:700;
    letter-spacing:.04em;
    border-radius:999px;
    padding:.3rem .6rem;
  }

  .tag--live{
    background:rgba(46,158,91,.12);
    color:var(--green-600);
  }

  .tag--live i{
    width:6px; height:6px; border-radius:50%;
    background:var(--green-600);
    display:inline-block;
    animation:pulse 2.2s infinite;
  }

  .tag--site{
    background:var(--blue-100);
    color:var(--blue-700);
  }

  .card__btn{
    display:block;
    text-align:center;
    margin-top:.9rem;
    background:var(--c, var(--blue-700));
    color:#fff;
    font-family:var(--font-body);
    font-weight:700;
    font-size:.85rem;
    border-radius:12px;
    padding:.62rem 1rem;
    box-shadow:0 3px 0 rgba(10,40,80,.22);
    transition:filter .15s ease, transform .12s ease;
  }

  a.card:hover .card__btn{ filter:brightness(1.08); }
  a.card:active .card__btn{ transform:translateY(2px); box-shadow:0 1px 0 rgba(10,40,80,.22); }

  /* placeholder */
  .card--soon{
    background:rgba(255,255,255,.42);
    border:2.5px dashed rgba(255,255,255,.8);
    box-shadow:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:2.25rem 1.5rem;
    min-height:200px;
  }

  .card--soon .soon__icon{
    width:48px; height:48px;
    border-radius:50%;
    background:rgba(255,255,255,.85);
    color:var(--blue-700);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:.85rem;
  }
  .card--soon .soon__icon svg{ width:24px; height:24px; }

  .soon__no{
    font-family:var(--font-display);
    font-weight:800;
    font-size:.72rem;
    letter-spacing:.1em;
    color:#fff;
    margin:0 0 .3rem;
  }

  .soon__text{
    margin:0;
    font-weight:700;
    font-size:.92rem;
    line-height:1.6;
    color:#fff;
    text-shadow:0 1px 3px rgba(10,40,80,.3);
  }

  /* ---------- FOOTER ---------- */
  .foot{
    margin-top:2.25rem;
    background:rgba(255,255,255,.95);
    border-radius:18px;
    padding:1rem 1.25rem;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:.85rem;
    box-shadow:0 8px 22px rgba(10,40,80,.16);
  }

  .foot__note{
    margin:0;
    font-size:.85rem;
    color:var(--ink-soft);
    font-weight:600;
  }

  .foot__badge{
    display:inline-flex;
    flex-direction:column;
    align-items:flex-end;
    line-height:1.2;
  }

  .foot__badgeMain{
    background:var(--amber-500);
    color:var(--blue-900);
    font-family:var(--font-display);
    font-weight:900;
    font-size:.95rem;
    letter-spacing:.06em;
    border-radius:10px;
    padding:.3rem .7rem;
  }

  .foot__badgeSub{
    font-size:.66rem;
    font-weight:700;
    color:var(--ink-soft);
    margin-top:.25rem;
    letter-spacing:.02em;
  }

  /* ---------- MOTION ---------- */
  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }

  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; opacity:1; transform:none; }
    .tag--live i{ animation:none; }
    html{ scroll-behavior:auto; }
  }

  @media (max-width:480px){
    .banner{ border-width:3px; }
    .card__title{ font-size:.95rem; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="topbar">
    <div class="lang-group" role="group" aria-label="Language">
      <button class="lang-btn" data-lang="th" type="button">ไทย</button>
      <button class="lang-btn" data-lang="en" type="button">EN</button>
      <button class="lang-btn" data-lang="mm" type="button">မြန်မာ</button>
    </div>
  </div>

  <header class="hero">
    <div class="banner">
      <h1 id="bannerTitle"></h1>
      <p id="bannerSub"></p>
    </div>

    <p class="hero__lead" id="heroLead"></p>

    <div class="hero__stats">
      <span class="stat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span id="statCount"></span>
      </span>
      <span class="stat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span id="statClock"></span>
      </span>
      <span class="stat stat--sites">WFDC · CDC · HDC</span>
    </div>
  </header>

  <main class="grid" id="grid"></main>

  <footer class="foot">
    <p class="foot__note" id="footNote"></p>
    <span class="foot__badge">
      <span class="foot__badgeMain">CJ IT</span>
      <span class="foot__badgeSub">IT for a Better Tomorrow</span>
    </span>
  </footer>

</div>

<script>
  // ==================================================================
  //  ไอคอน / ICONS
  // ==================================================================
  const ICONS = {

    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3.5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1V4"/><path d="M9 13l2 2 4-4.5"/></svg>',

  // ==================================================================
  //  ภาษา / LANGUAGES

  const I18N = {

      bannerTitle:'ศูนย์รวมระบบไอที WFDC',
      bannerSub:'WFDC Systems Board · วังน้อย',

    },
    en:{

  // ==================================================================
  //  ระบบทั้งหมด / SYSTEMS

    {

      status:'live'
    },
    {
      no:'02', color:'#D8342A', icon:'ticket',
      nameEn:'Claim & CS Ticket',
      name:{ th:'ระบบ Ticket งาน Claim & CS', en:'Claim & CS case ticketing', mm:'Claim & CS လုပ်ငန်း Ticket စနစ်' },
      desc:{

      },

    },
    {
      no:'03', color:'#C07A15', icon:'box',
      nameEn:'WFDC Stationary Stock',
      name:{ th:'ระบบเบิกจ่ายอุปกรณ์สำนักงานและเครื่องเขียน', en:'Office supplies & stationery requisition', mm:'ရုံးသုံးပစ္စည်းနှင့် စာရေးကိရိယာ ထုတ်ယူရေး စနစ်' },
      desc:{
        th:'เบิกอุปกรณ์สำนักงานและเครื่องเขียนสำหรับพนักงาน ตรวจสอบสต๊อกและประวัติการเบิก',
        en:'Request office supplies and stationery, check stock levels, and view requisition history.',
        mm:'ရုံးသုံးပစ္စည်းနှင့် စာရေးကိရိယာများ တောင်းခံခြင်း၊ စတော့လက်ကျန် စစ်ဆေးခြင်းနှင့် ထုတ်ယူမှတ်တမ်း ကြည့်ရှုခြင်း'

    {

      nameEn:'Container Loading',
      name:{ th:'ระบบบันทึกภาพโหลดสินค้าเข้าตู้', en:'Container loading photo log', mm:'ကွန်တိန်နာ ကုန်တင် ဓာတ်ပုံမှတ်တမ်း စနစ်' },
      desc:{

        en:'Photo-log every container loading trip, with a dashboard and history export (PDF / ZIP).',

      site:'WFDC',

      desc:{

      name:{ th:'ระบบตรวจ 5ส', en:'5S audit & corrective action', mm:'5S စစ်ဆေးရေး/ပြင်ဆင်ရေး စနစ်' },
      desc:{
        th:'หัวหน้างานเดินตรวจ ถ่ายภาพจุดที่ต้องแก้ไข มอบหมายโซนที่รับผิดชอบ แล้วตรวจปิดงาน',

  // ==================================================================
  //  ENGINE — ไม่ต้องแก้ส่วนล่างนี้
  // ==================================================================
  let lang = localStorage.getItem('wfdc_lang') || 'th';
  if(!I18N[lang]) lang = 'th';

  function render(){
    const t = I18N[lang];
    document.documentElement.lang = (lang === 'mm') ? 'my' : lang;

    document.getElementById('bannerTitle').textContent = t.bannerTitle;
    document.getElementById('bannerSub').textContent  = t.bannerSub;
    document.getElementById('heroLead').textContent   = t.lead;
    document.getElementById('statCount').textContent  = SYSTEMS.length + ' ' + t.count;
    document.getElementById('footNote').textContent   = t.footer;

    document.querySelectorAll('.lang-btn').forEach(b => {
      b.classList.toggle('is-active', b.dataset.lang === lang);
    });

    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    SYSTEMS.forEach((s, i) => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = s.url;
      card.target = '_blank';
      card.rel = 'noopener';
      card.style.setProperty('--c', s.color);
      card.style.animationDelay = (i * 0.06) + 's';
      card.innerHTML = `
        <div class="card__bar">
          <span class="card__icon">${ICONS[s.icon] || ''}</span>
          <span class="card__barText">
            <span class="card__no">NO. ${s.no}</span>
            <span class="card__title">${s.nameEn}</span>
          </span>
        </div>
        <div class="card__body">
          <p class="card__localName">${s.name[lang]}</p>
          <p class="card__desc">${s.desc[lang]}</p>
          <div class="card__foot">
            <span class="tag tag--site">${s.site}</span>
            <span class="tag tag--live"><i></i>${s.status === 'live' ? 'LIVE' : s.status.toUpperCase()}</span>
          </div>
          <span class="card__btn">${t.open} →</span>
        </div>
      `;
      grid.appendChild(card);
    });

    const nextNo = String(SYSTEMS.length + 1).padStart(2, '0');
    const soon = document.createElement('div');
    soon.className = 'card card--soon';
    soon.style.animationDelay = (SYSTEMS.length * 0.06) + 's';
    soon.innerHTML = `
      <span class="soon__icon">${ICONS.plus}</span>
      <p class="soon__no">NO. ${nextNo}</p>
      <p class="soon__text">${t.soon}</p>
    `;
    grid.appendChild(soon);

    tickClock();
  }

  function tickClock(){
    const el = document.getElementById('statClock');
    if(!el) return;
    const d = new Date();
    const hh = String(d.getHours()).padStart(2,'0');
    const mm = String(d.getMinutes()).padStart(2,'0');
    el.textContent = I18N[lang].updated + ' ' + hh + ':' + mm;
  }

  document.querySelectorAll('.lang-btn').forEach(b => {
    b.addEventListener('click', () => {
      lang = b.dataset.lang;
      localStorage.setItem('wfdc_lang', lang);
      render();
    });
  });

  render();
  setInterval(tickClock, 30000);
</script>

</body>
</html>
