name: Deploy Landing Page to Firebase Hosting

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * *"   # daily 08:00 Bangkok, picks up app repo changes
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Stage site (Landing Page + apps)
        run: |
          set -e
          mkdir -p _site /tmp/apps
          rsync -a --exclude '.git' --exclude '.github' --exclude 'firebase.json' --exclude '.firebaserc' --exclude 'README.md' --exclude '_site' ./ _site/
          # repo:slug
          for pair in \
            "claim-cs-ticket:claim-cs-ticket" \
            "Picker-Check-100:picker-check-100" \
            "Loader-Daily:loader-daily" \
            "WFDC-AssetChecker:asset-checker" \
            "5S-Project:5s-project" \
            "Agency-Attendance:agency-attendance" \
            "WarehouseAsset:warehouse-asset" \
            "CDC-TicketSystems:cdc-ticket-systems"; do
            repo="${pair%%:*}"; slug="${pair##*:}"
            rm -rf "/tmp/apps/$repo"
            git clone -q --depth 1 "https://github.com/berstream/$repo" "/tmp/apps/$repo"
            mkdir -p "_site/$slug"
            rsync -a --exclude '.git' "/tmp/apps/$repo/" "_site/$slug/"
          done
          # Real landing page lives in landing.html; index.html at repo root is the GitHub Pages redirect
          cp landing.html _site/index.html
          # Apps that used absolute paths on GitHub Pages
          if [ -f _site/warehouse-asset/manifest.json ]; then
            sed -i 's#"/WarehouseAsset/#"/warehouse-asset/#g' _site/warehouse-asset/manifest.json
          fi
          # CDC-TicketSystems has no index.html; serve Ticket.html at the folder root
          if [ ! -f _site/cdc-ticket-systems/index.html ] && [ -f _site/cdc-ticket-systems/Ticket.html ]; then
            cp _site/cdc-ticket-systems/Ticket.html _site/cdc-ticket-systems/index.html
          fi

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: wfdc-landing
          channelId: live
